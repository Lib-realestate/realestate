<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D2624">
<title>収支シミュレーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F1EA;--card:#fff;--line:#E2DED3;--ink:#1D2624;--sub:#5E6763;--cf:#1E6B58;--sale:#2F5FD0;--fin:#D0342C;--ink2:#23386E;--neg:#B23A2E;--chk:#FFF3D1;--chkb:#D69B2D;--auto:#F1EFE9}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;cursor:pointer}
a{color:var(--cf)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--ink2);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:var(--ink);color:var(--bg);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:12px}
header h1{font-size:16px;margin:0;white-space:nowrap;letter-spacing:.04em}
#tabs{display:flex;gap:6px;flex:1;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;height:34px;padding:0 10px 0 12px;border-radius:8px;border:1px solid #4A5552;background:transparent;color:var(--bg);font-size:13px;display:flex;align-items:center;gap:6px}
.tab.on{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.tab small{font-size:10px;opacity:.7}
.tab .x{border:0;background:transparent;color:inherit;opacity:.6;font-size:14px;padding:0 2px}
.tab.new{border-style:dashed;padding:0 12px}
.hbtn{height:34px;padding:0 12px;border-radius:8px;border:1px solid #7C8783;background:transparent;color:var(--bg);font-size:12px;white-space:nowrap}
.hbtn.pri{background:#E9C46A;color:var(--ink);border:0;font-weight:700}
#drv{display:flex;align-items:center;gap:6px}
#drv i{width:8px;height:8px;border-radius:50%;background:#7C8783}
#drv.on i{background:#6FCF97}
.wrap{display:grid;grid-template-columns:420px minmax(0,1fr);gap:16px;padding:16px;max-width:1500px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
#inp{padding:12px 14px;display:flex;flex-direction:column;gap:8px;align-self:start}
.up{height:42px;border-radius:8px;border:1.5px dashed var(--cf);background:#EEF5F1;color:var(--cf);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.up.drag{background:#D9EBE2}
#ind{position:sticky;top:56px;z-index:5;background:#fff;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ind{background:#fff;padding:6px 8px;display:flex;flex-direction:column;gap:1px;min-width:0}
.ind .l{font-size:10px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ind .n{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.ind .n small{font-size:10px;font-weight:500;color:var(--sub)}
.ok{color:var(--cf)}.warn{color:#B07A12}.bad{color:var(--neg)}
.legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--sub);flex-wrap:wrap}
.legend b{width:12px;height:12px;border-radius:3px;display:inline-block}
details{border-top:1px solid var(--line)}
summary{list-style:none;display:flex;align-items:center;gap:8px;padding:8px 0 6px;font-size:12px;font-weight:700;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary .sum{font-weight:400;color:var(--sub);margin-left:auto;font-size:11px;text-align:right}
details[open] summary .sum{display:none}
summary .extra{margin-left:auto;display:flex;gap:4px}
details:not([open]) summary .extra{display:none}
.chip{font-size:10px;font-weight:500;padding:2px 7px;border-radius:999px;background:var(--auto);color:var(--sub)}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px 8px;padding-bottom:8px}
.s2{grid-column:span 2}.s3{grid-column:span 3}
.f{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--sub);min-width:0}
.box{display:flex;align-items:center;height:32px;border:1px solid #D6D1C4;border-radius:6px;background:#fff;padding:0 8px;gap:4px}
.box input,.box select{border:0;outline:0;background:transparent;width:100%;min-width:0;font:inherit;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums;padding:0}
.box span{font-size:10.5px;color:var(--sub);white-space:nowrap}
.box:focus-within{border-color:var(--ink2)}
.box.chk{background:var(--chk);border-color:var(--chkb)}
.box.auto{background:var(--auto);border-color:var(--line)}
.seg{display:flex;height:32px;border:1px solid #D6D1C4;border-radius:6px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;color:var(--sub);font-size:12px;white-space:nowrap;padding:0 4px}
.seg button.on{background:var(--ink);color:#fff}
.mini{height:24px;padding:0 8px;border-radius:6px;border:1px solid #D6D1C4;background:#fff;color:var(--sub);font-size:11px}
.mini.on{background:var(--cf);border-color:var(--cf);color:#fff}
.links{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.links a,.links button{height:28px;display:inline-flex;align-items:center;padding:0 8px;border-radius:6px;border:1px solid #D6D1C4;background:#fff;color:var(--ink);font-size:11.5px;text-decoration:none;white-space:nowrap}
.links a:hover,.links button:hover{border-color:var(--cf)}
.foot{height:34px;border-radius:8px;border:1px solid #D6D1C4;background:#fff;font-size:12px;color:var(--ink)}
#res{display:flex;flex-direction:column;gap:14px;min-width:0}
.top{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:stretch}
.sale{grid-column:span 3;padding:12px 14px;display:grid;grid-template-columns:240px minmax(0,1fr);column-gap:20px;row-gap:2px;align-items:start}
.sale>.lb,.sale>label,.sale>.ticks{grid-column:1}
.sale>.g3{grid-column:2;grid-row:1 / span 3;margin-top:0;grid-template-columns:repeat(6,minmax(0,1fr))}
.sale .lb{font-size:12px;color:var(--sub);display:flex;justify-content:space-between;align-items:baseline}
.sale .g3{padding-bottom:0}
.lines{display:flex;flex-direction:column;gap:3px;padding:6px 0;border-bottom:1px solid var(--line)}
.ln{display:flex;justify-content:space-between;gap:8px;font-size:12px;line-height:1.35}
.ln small{display:block;font-size:10.5px;color:var(--sub)}
.ln .num{white-space:nowrap}
.tot{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:11px;color:var(--sub)}
.tot2{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:12px;padding-top:4px;border-top:1px dashed var(--line)}
.kpi{padding:12px 14px;display:flex;flex-direction:column;justify-content:flex-start;gap:4px}
.kpi .lb{font-size:12.5px;font-weight:700;display:flex;justify-content:space-between;gap:6px}
.kpi .v{font-size:28px;font-weight:700;line-height:1.1}
.kpi .v small{font-size:13px;font-weight:500}
.kpi .n{font-size:11px;color:var(--sub)}
.k1{border-top:4px solid var(--cf)}.k1 .v{color:var(--cf)}
.k2{border-top:4px solid var(--sale)}.k2 .v{color:#2450B8}
.k3{border-top:4px solid var(--fin);background:#FDF5F4}
.yr .v{font-size:30px}
input[type=range]{width:100%;accent-color:var(--ink);height:26px;margin:0}
.ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--sub)}
#chartCard{padding:12px 14px}
.lg{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;font-size:12px;margin-bottom:6px}
.lg span{display:flex;align-items:center;gap:6px}
.lg i{width:18px;height:3px;display:inline-block}
.lg .r{margin-left:auto;display:flex;gap:6px}
#chart{position:relative;width:100%}
#chart svg{display:block}
.lower{display:block}
.fb{padding:8px 10px;border-radius:8px}
.fl{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;line-height:1.7}
.fl b{white-space:nowrap}
.fs{font-size:11.5px;color:var(--sub);line-height:1.7}
#tbl{display:flex;flex-direction:column;overflow:hidden;max-height:420px}
.tr{display:grid;grid-template-columns:38px repeat(6,minmax(0,1fr));gap:4px;padding:5px 12px;font-size:12px;text-align:right;border:0;border-bottom:1px solid #F1EFE9;background:#fff;width:100%;color:var(--ink)}
.tr>:first-child{text-align:left}
.tr.h{font-size:11px;color:var(--sub);border-bottom:1px solid var(--line);padding:9px 12px}
.tr:nth-child(even){background:#FAF9F5}
.tr.on{background:#E3EDE8;font-weight:700}
.tr.now{box-shadow:inset 3px 0 0 #9AA29E}
.tb{overflow-y:auto}
.neg{color:var(--neg)!important}
.empty{padding:40px 20px;text-align:center;color:var(--sub);font-size:14px;line-height:1.8}
#nav{display:none}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw}
#toast.show{opacity:1}
#loading{position:fixed;inset:0;background:rgba(29,38,36,.45);display:none;align-items:center;justify-content:center;z-index:60;color:#fff;font-size:14px}
#loading.show{display:flex}
#menu{position:absolute;right:16px;top:calc(56px + env(safe-area-inset-top,0px));background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(29,38,36,.18);display:none;flex-direction:column;min-width:220px;z-index:30;overflow:hidden}
#menu.show{display:flex}
#menu button{border:0;background:#fff;text-align:left;padding:12px 14px;font-size:13px;color:var(--ink);border-bottom:1px solid #F1EFE9}
#menu button:hover{background:#F6F5F0}
@media (max-width:1180px){.sale{grid-template-columns:1fr}.sale>.g3{grid-column:1;grid-row:auto;margin-top:8px;grid-template-columns:repeat(3,minmax(0,1fr))}.top{grid-template-columns:1fr}.sale{grid-column:auto}}
@media (max-width:999px){
  .wrap{grid-template-columns:1fr;padding:10px;padding-bottom:80px}
  body.v-res #inp{display:none} body.v-inp #res{display:none}
  #nav{display:grid;grid-template-columns:repeat(2,1fr);position:fixed;left:0;right:0;bottom:0;height:calc(58px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:#fff;border-top:1px solid var(--line);z-index:20}
  #nav button{border:0;background:#fff;font-size:13px;color:var(--sub)}
  #nav button.on{color:var(--ink);font-weight:700;box-shadow:inset 0 3px 0 var(--ink)}
  header{flex-wrap:wrap;gap:8px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
  header h1{font-size:15px}
  #tabs{order:5;flex-basis:100%}
  .hide-sp{display:none}
  #drv.hide-sp{display:flex;padding:0 8px}
  #drv.hide-sp span{display:none}
  .hbtn{padding:0 10px}
  #btnSave{font-size:12px}
  #btnMenu{margin-left:auto}
  .top{gap:10px}
  .kpi .v{font-size:24px}
  .tr{font-size:10.5px;padding:6px 6px;gap:2px;grid-template-columns:24px repeat(6,minmax(0,1fr))}
  .box input,.box select{font-size:16px}
  #ind{position:static;grid-template-columns:repeat(2,minmax(0,1fr))}
  #menu{top:calc(52px + env(safe-area-inset-top,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body class="v-inp">
<header>
  <h1>収支シミュレーター</h1>
  <nav id="tabs" aria-label="評価履歴"></nav>
  <button class="hbtn hide-sp" id="drv" type="button"><i></i><span>Drive未接続</span></button>
  <button class="hbtn" id="btnMenu" type="button" aria-label="メニュー">メニュー</button>
  <button class="hbtn pri" id="btnSave" type="button">保存</button>
  <div id="menu" role="menu">
    <button type="button" data-m="drive" id="mDrive">Googleドライブに接続</button>
    <button type="button" data-m="sync">ドライブから最新を読み込む</button>
    <button type="button" data-m="status">保存の状態を確認</button>
    <button type="button" data-m="defaults">今の条件を初期値として保存</button>
    <button type="button" data-m="dup">この評価を複製して新規</button>
    <button type="button" data-m="del">この評価を削除</button>
    <button type="button" data-m="worker">読み取り用サーバーの設定</button>
  </div>
</header>

<div class="wrap">
<section class="card" id="inp" aria-label="入力">
  <button class="up" id="btnUp" type="button">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v4h16v-4"/></svg>
    マイソクを読み込む（PDF・画像・貼り付け）
  </button>
  <input type="file" id="fileIn" accept="image/*,application/pdf" multiple hidden>
  <div id="ind" aria-label="指標（1年目）"></div>
  <div class="legend"><b style="background:var(--chk);border:1px solid var(--chkb)"></b>記載なし・要確認<span id="chkCount"></span><b style="background:var(--auto);border:1px solid var(--line);margin-left:8px"></b>自動計算</div>

  <details open data-sec="prop">
    <summary>物件情報<span class="sum" id="sumProp"></span></summary>
    <div class="g3">
      <label class="f s3">物件名<div class="box"><input data-t="name" placeholder="例：〇〇町アパート"></div></label>
      <label class="f s3">所在地<div class="box"><input data-t="addr" placeholder="〇〇県〇〇市〇〇町1-2-3"></div></label>
      <label class="f">価格<div class="box"><input data-k="price" inputmode="decimal"><span>万円</span></div></label>
      <label class="f">満室家賃<div class="box"><input data-k="rent" inputmode="decimal"><span>万円/年</span></div></label>
      <label class="f">表面利回り<div class="box auto"><input id="aYield" readonly tabindex="-1"><span>%</span></div></label>
      <label class="f">構造<div class="box"><select data-t="struct"><option>木造</option><option>軽量鉄骨</option><option>重量鉄骨</option><option>RC</option></select></div></label>
      <label class="f">築年（西暦）<div class="box"><input data-k="built" inputmode="numeric"><span>年</span></div></label>
      <label class="f">戸数<div class="box"><input data-k="units" inputmode="numeric"><span>戸</span></div></label>
      <label class="f">延床面積<div class="box"><input data-k="floor" inputmode="decimal"><span>㎡</span></div></label>
      <label class="f">土地面積<div class="box"><input data-k="landArea" inputmode="decimal"><span>㎡</span></div></label>
      <label class="f">償却年数<div class="box auto"><input id="aLife" readonly tabindex="-1"><span>年</span></div></label>
      <label class="f">購入年（西暦）<div class="box"><input data-k="buyYear" inputmode="numeric" placeholder="これから買う場合は空欄"><span>年</span></div></label>
      <label class="f">購入月<div class="box"><input data-k="buyMonth" inputmode="numeric"><span>月</span></div></label>
      <label class="f"><span id="lbNow">今の満室家賃</span><div class="box auto"><input id="aNowRent" readonly tabindex="-1"><span>万円/年</span></div></label>
    </div>
    <div class="links" style="padding-bottom:8px">
      <button type="button" id="btnCopy">住所をコピー</button>
      <a href="https://owners.sumasate.jp/assessments/new" target="_blank" rel="noopener">スマサテ↗</a>
      <a href="https://toushi.homes.co.jp/owner/" target="_blank" rel="noopener">HOME'S 需要↗</a>
      <a href="https://porty.co.jp/assess" target="_blank" rel="noopener">ポルティ↗</a>
    </div>
    <div class="g3">
      <label class="f">査定家賃（月額）<div class="box"><input data-k="aRentM" inputmode="decimal"><span>万円/月</span></div></label>
      <label class="f">査定での利回り<div class="box auto"><input id="aYield2" readonly tabindex="-1"><span>%</span></div></label>
      <div class="f">&nbsp;<button type="button" class="foot" id="btnApplyRent" style="height:32px">満室家賃に反映</button></div>
    </div>
  </details>

  <details open data-sec="ratio">
    <summary>土地・建物の割合<span class="sum" id="sumRatio"></span><span class="extra"><button type="button" class="mini" data-lm="eval">固定資産税評価から</button><button type="button" class="mini" data-lm="manual">手入力</button></span></summary>
    <div class="g3">
      <label class="f">土地の評価額<div class="box"><input data-k="landEval" inputmode="decimal"><span>万円</span></div></label>
      <label class="f">建物の評価額<div class="box"><input data-k="bldgEval" inputmode="decimal"><span>万円</span></div></label>
      <label class="f">建物の割合<div class="box"><input data-k="bratio" inputmode="decimal"><span>%</span></div></label>
    </div>
  </details>

  <details open data-sec="cf">
    <summary>収支・修繕<span class="sum" id="sumCf"></span></summary>
    <div class="g3">
      <label class="f">空室率<div class="box"><input data-k="vac" inputmode="decimal"><span>%</span></div></label>
      <label class="f">経費率<div class="box"><input data-k="exp" inputmode="decimal"><span>%</span></div></label>
      <label class="f">家賃下落<div class="box"><input data-k="dec" inputmode="decimal"><span>%/年</span></div></label>
      <label class="f"><span id="lbUnit">修繕単価</span><div class="box"><input data-k="unit" inputmode="decimal"><span>万円/㎡</span></div></label>
      <label class="f">修繕の間隔<div class="box"><input data-k="every" inputmode="numeric"><span>年ごと</span></div></label>
      <label class="f">修繕額<div class="box auto"><input id="aRepair" readonly tabindex="-1"><span>万円</span></div></label>
    </div>
  </details>

  <details open data-sec="loan">
    <summary>購入時の費用・融資<span class="sum" id="sumLoan"></span></summary>
    <div class="g3">
      <label class="f">購入諸費用（率）<div class="box"><input data-k="buyPct" inputmode="decimal"><span>%</span></div></label>
      <label class="f">購入諸費用（額）<div class="box"><input data-k="buyAmt" inputmode="decimal"><span>万円</span></div></label>
      <label class="f">自己資金<div class="box auto"><input id="aOwn" readonly tabindex="-1"><span>万円</span></div></label>
      <label class="f">借入割合<div class="box"><input data-k="loanPct" inputmode="decimal"><span>%</span></div></label>
      <label class="f">借入額<div class="box"><input data-k="loan" inputmode="decimal"><span>万円</span></div></label>
      <label class="f">金利<div class="box"><input data-k="rate" inputmode="decimal"><span>%</span></div></label>
      <label class="f">期間<div class="box"><input data-k="term" inputmode="numeric"><span>年</span></div></label>
      <label class="f">返済方法<div class="box auto"><input value="元利均等" readonly tabindex="-1"></div></label>
      <label class="f">年間返済<div class="box auto"><input id="aPay" readonly tabindex="-1"><span>万円</span></div></label>
    </div>
  </details>

  <button type="button" class="foot" id="btnDef">今の条件（空室率・経費率・修繕単価・売却条件など）を初期値として保存</button>
</section>

<main id="res">
  <div class="top">
    <div class="card sale">
      <div class="lb"><span>売却する年</span><span class="v num" id="kY"></span></div>
      <label><span style="position:absolute;width:1px;height:1px;overflow:hidden">売却する年</span><input type="range" id="rng" min="1" max="40" value="10"></label>
      <div class="ticks num"><span>1年</span><span>10</span><span>20</span><span>30</span><span>40年</span></div>
      <div class="g3">
        <label class="f">利回り（1年目）<div class="box"><input data-k="exitY" inputmode="decimal"><span>%</span></div></label>
        <label class="f">利回りの上昇<div class="box"><input data-k="yUp" inputmode="decimal"><span>%/年</span></div></label>
        <label class="f"><span id="lbEy">その年の利回り</span><div class="box auto"><input id="aEy" readonly tabindex="-1"><span>%</span></div></label>
        <label class="f">土地値<div class="box"><input data-k="landVal" inputmode="decimal"><span>万円</span></div></label>
        <label class="f">解体費<div class="box"><input data-k="demo" inputmode="decimal"><span>万円</span></div></label>

<nav id="nav" aria-label="画面切り替え"><button type="button" data-v="inp" class="on">入力</button><button type="button" data-v="res">結果</button></nav>
<div id="toast" role="status"></div>
<div id="loading"><span id="loadingT">読み込み中…</span></div>
<script>
/* ===== 基本設定 ===== */
const NOW_Y=new Date().getFullYear(),NOW_M=new Date().getMonth()+1;
const UNIT0={'木造':1.5,'軽量鉄骨':1.8,'重量鉄骨':2.0,'RC':2.5};
const DEMO={'木造':1.2,'軽量鉄骨':1.5,'重量鉄骨':1.8,'RC':2.5};
const LIFE={'木造':22,'軽量鉄骨':27,'重量鉄骨':34,'RC':47};
const DEF0={vac:15,exp:20,dec:0.5,unitMap:UNIT0,every:15,buyPct:7,exitY:10.5,yUp:0.05,demoOn:true,demoMap:DEMO,sellPct:4,taxCorp:34,taxInd:30,rate:2,term:30,mode:'corp'};
const DEF_KEYS=Object.keys(DEF0);
const BLANK={name:'',addr:'',struct:'木造',landMode:'eval',price:0,rent:0,built:0,units:0,floor:0,landArea:0,landEval:0,bldgEval:0,bratio:30,loan:0,aRentM:0,buyYear:0,buyMonth:0,landValM:null,demoM:null};
const LS_KEY='sim_store_v1';
const $=id=>document.getElementById(id);
const clone=o=>JSON.parse(JSON.stringify(o));
const pn=s=>{const v=parseFloat(String(s).replace(/[,，\s]/g,''));return isFinite(v)?v:null;};
const fm=v=>{if(!isFinite(v))return '−';const r=Math.round(v);return (r<0?'−':'')+Math.abs(r).toLocaleString('ja-JP');};
const fd=(v,d)=>{if(!isFinite(v))return '';const p=Math.pow(10,d);return (Math.round(v*p)/p).toLocaleString('ja-JP',{maximumFractionDigits:d});};
const fmE=v=>v?fm(v):'';
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('show'),2600);}
function loading(on,t){$('loading').classList.toggle('show',on);if(t)$('loadingT').textContent=t;}

/* ===== 保存データ ===== */
let store=(()=>{try{const s=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(s&&s.items)return s;}catch(e){}return {defaults:clone(DEF0),items:[],savedAt:null};})();
store.defaults=Object.assign(clone(DEF0),store.defaults||{});
store.defaults.unitMap=Object.assign({},UNIT0,store.defaults.unitMap||{});store.defaults.demoMap=Object.assign({},DEMO,store.defaults.demoMap||{});
function newInp(){return Object.assign(clone(BLANK),clone(store.defaults));}
let cur={id:null,inp:newInp(),Y:10,chk:['landEval','bldgEval'],dirty:false};
let D,M;

function saveLocal(){store.savedAt=new Date().toISOString();try{localStorage.setItem(LS_KEY,JSON.stringify(store));}catch(e){}}

/* ===== 計算 ===== */
function derive(I){
  const byr=I.buyYear||NOW_Y,bmo=I.buyMonth||1;
  const nowT=I.buyYear?Math.min(40,Math.max(1,Math.floor(((NOW_Y*12+NOW_M)-(byr*12+bmo))/12)+1)):1;
  const age=I.built?Math.max(0,byr-I.built):0,L=LIFE[I.struct]||22;
  const life=Math.max(2,age>=L?Math.floor(L*0.2):Math.floor((L-age)+age*0.2));
  const ev=I.landEval+I.bldgEval;
  const bratio=I.landMode==='eval'?(ev>0?I.bldgEval/ev*100:0):I.bratio;
  const unit=(I.unitMap&&I.unitMap[I.struct]!=null)?I.unitMap[I.struct]:UNIT0[I.struct];
  const repair=I.floor*unit,buyAmt=I.price*I.buyPct/100;
  const landAuto=I.landEval>0?I.landEval/0.7:0,landVal=I.landValM!=null?I.landValM:landAuto;
  const demoUnit=(I.demoMap&&I.demoMap[I.struct]!=null)?I.demoMap[I.struct]:(DEMO[I.struct]||1.2),demoAuto=I.floor*demoUnit,demo=I.demoM!=null?I.demoM:demoAuto;
  return {age,nowT,life,bratio,unit,repair,buyAmt,own:I.price+buyAmt-I.loan,landAuto,landVal,demoUnit,demoAuto,demo};
}
function model(I,D){
  const mode=I.mode,own=D.own,loan=I.loan,term=Math.max(0,Math.round(I.term)),r=I.rate/100/12,n=term*12;
  const pm=n>0&&loan>0?(r>0?loan*r/(1-Math.pow(1+r,-n)):loan/n):0,pay=pm*12;
  const bal=t=>{if(t>=term||n===0||loan<=0)return 0;const m=12*t;return r>0?loan*Math.pow(1+r,m)-pm*(Math.pow(1+r,m)-1)/r:loan-pm*m;};
  const basis=I.price+D.buyAmt,bldg=basis*D.bratio/100,land=basis-bldg,every=Math.max(1,Math.round(I.every||1));
  const holdRate=(mode==='corp'?I.taxCorp:I.taxInd)/100;
  let cum=0,depCum=0,tax=0,loss=0,cInc=0,cEx=0,cPy=0,cRep=0;const rows=[];
  for(let t=1;t<=40;t++){
    const full=I.rent*Math.pow(1-I.dec/100,t-1),inc=full*(1-I.vac/100),ex=inc*I.exp/100,noi=inc-ex;
    const py=t<=term?pay:0,b0=bal(t-1),b1=bal(t),interest=Math.max(0,py-(b0-b1));
    const rep=t%every===0?D.repair:0,dep=t<=D.life?bldg/D.life:0;depCum+=dep;
    const cf=noi-py-rep;cum+=cf;cInc+=inc;cEx+=ex;cPy+=py;cRep+=rep;
    let ti=noi-interest-dep-rep;
    if(mode==='corp'){if(ti<0){loss+=-ti;ti=0;}else{const u=Math.min(loss,ti);loss-=u;ti-=u;}tax+=ti*holdRate;}
    else tax+=Math.max(0,ti)*holdRate;
    const ey=Math.max(0.1,I.exitY+(I.yUp||0)*(t-1)),yp=full/(ey/100),dAll=I.demoOn?D.demo:0;
    const useLand=D.landVal>0&&(D.landVal-dAll)>yp,sp=useLand?D.landVal:yp,dm=useLand?dAll:0;
    const broker=(sp*0.03+6)*1.1,sc=sp*I.sellPct/100,spl=sp-b1-sc-dm,pre=cum+spl-own;
    const bleft=Math.max(0,bldg-depCum),book=land+bleft,gain=sp-sc-dm-book,lossUse=mode==='corp'?Math.min(loss,Math.max(0,gain)):0;
    const sr=mode==='corp'?I.taxCorp/100:(t>5?0.20315:0.3963),st=Math.max(0,gain-lossUse)*sr;
    const hold=cum-own-tax;
    rows.push({t,ey,yp,useLand,dm,full,inc,ex,noi,py,rep,cf,cum,hold,cInc,cEx,cPy,cRep,b1,land,bldg,depCum,bleft,lossUse,sp,broker,sc,spl,pre,holdTax:tax,book,gain,sr,st,post:hold+spl-st,per:(hold+spl-st)/t});
  }
  return {own,pay,rows};
}
const row=()=>M.rows[cur.Y-1];

/* ===== 入力欄の定義 ===== */
const F={
  price:{f:fmE},rent:{f:fmE},built:{f:v=>v?String(v):''},buyYear:{f:v=>v?String(v):''},buyMonth:{f:v=>v?String(v):''},units:{f:v=>v?String(v):''},
  floor:{f:v=>v?fd(v,2):''},landArea:{f:v=>v?fd(v,2):''},landEval:{f:fmE},bldgEval:{f:fmE},
  bratio:{g:()=>D.bratio,f:v=>fd(v,1),s:v=>{if(cur.inp.landMode==='manual')cur.inp.bratio=v;}},
  aRentM:{f:v=>v?fd(v,2):''},
  vac:{f:v=>fd(v,1)},exp:{f:v=>fd(v,1)},dec:{f:v=>fd(v,2)},
  unit:{g:()=>D.unit,f:v=>fd(v,2),s:v=>{cur.inp.unitMap=Object.assign({},cur.inp.unitMap,{[cur.inp.struct]:v});}},
  every:{f:v=>String(v)},loan:{f:fmE},rate:{f:v=>fd(v,3)},term:{f:v=>String(v)},
  buyPct:{f:v=>fd(v,2)},
  loanPct:{g:()=>cur.inp.price>0?cur.inp.loan/cur.inp.price*100:0,f:v=>fd(v,1),s:v=>{if(cur.inp.price>0)cur.inp.loan=Math.round(cur.inp.price*v/100*100)/100;}},
  buyAmt:{g:()=>D.buyAmt,f:fmE,s:v=>{if(cur.inp.price>0)cur.inp.buyPct=v/cur.inp.price*100;}},
  exitY:{f:v=>fd(v,2)},yUp:{f:v=>fd(v,2)},
  landVal:{g:()=>D.landVal,f:fmE,s:v=>{cur.inp.landValM=v>0?v:null;}},
  demoUnit:{g:()=>D.demoUnit,f:v=>fd(v,2),s:v=>{cur.inp.demoMap=Object.assign({},cur.inp.demoMap,{[cur.inp.struct]:v});cur.inp.demoM=null;}},
  demo:{g:()=>D.demo,f:fmE,s:v=>{cur.inp.demoM=raw0?null:v;}},
  sellPrice:{g:()=>row().sp,f:fmE,s:v=>{if(!(v>0))return;const r=row();if(r.useLand)cur.inp.landValM=v;else if(r.full>0)cur.inp.exitY=r.full/v*100-(cur.inp.yUp||0)*(cur.Y-1);}},
  sellPct:{f:v=>fd(v,2)},
  sellCost:{g:()=>row().sc,f:fmE,s:v=>{if(row().sp>0)cur.inp.sellPct=v/row().sp*100;}},
  taxRate:{g:()=>cur.inp.mode==='corp'?cur.inp.taxCorp:cur.inp.taxInd,f:v=>fd(v,2),s:v=>{if(cur.inp.mode==='corp')cur.inp.taxCorp=v;else cur.inp.taxInd=v;}}
};
const inputs=[...document.querySelectorAll('[data-k]')];
const tInputs=[...document.querySelectorAll('[data-t]')];

function compute(){D=derive(cur.inp);M=model(cur.inp,D);}

function renderInputs(){
  const act=document.activeElement,I=cur.inp;
  inputs.forEach(el=>{
    const k=el.dataset.k,d=F[k];if(el===act)return;
    const v=d.g?d.g():I[k];el.value=d.f(v);
  });
  tInputs.forEach(el=>{if(el!==act)el.value=I[el.dataset.t]||'';});
  const ev=I.landMode==='eval';
  inputs.forEach(el=>{
    const k=el.dataset.k,box=el.parentElement;
    box.classList.toggle('chk',cur.chk.includes(k));
    if(k==='landEval'||k==='bldgEval')box.classList.toggle('auto',!ev&&!cur.chk.includes(k));
    if(k==='bratio'){box.classList.toggle('auto',ev);el.readOnly=ev;}
  });
  const nChk=cur.chk.length;$('chkCount').textContent=nChk?`（${nChk}項目）`:'';
  document.querySelectorAll('[data-lm]').forEach(b=>b.classList.toggle('on',b.dataset.lm===I.landMode));
  document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===I.mode));
  $('aYield').value=I.price>0&&I.rent>0?fd(I.rent/I.price*100,2):'';
  $('aYield2').value=I.price>0&&I.aRentM>0?fd(I.aRentM*12/I.price*100,2):'';
  $('aLife').value=I.built?String(D.life):'';
  $('lbNow').textContent=I.buyYear?'今（'+D.nowT+'年目）の満室家賃':'今の満室家賃';
  $('aNowRent').value=I.rent>0?fd(M.rows[D.nowT-1].full,1):'';
  $('aRepair').value=fmE(D.repair);
  $('aOwn').value=I.price>0?fm(D.own):'';
  $('aPay').value=M.pay?fm(M.pay):'';
  renderInd();
  {const r=row();$('aEy').value=fd(r.ey,2);$('lbEy').textContent=cur.Y+'年目の利回り';$('lbSp').textContent='売却価格（'+cur.Y+'年目・'+(r.useLand?'土地値':'利回り')+'で計算）';
   document.querySelectorAll('[data-demo]').forEach(b=>b.classList.toggle('on',(b.dataset.demo==='1')===!!I.demoOn));
   document.querySelector('[data-k="landVal"]').parentElement.classList.toggle('auto',I.landValM==null);
   document.querySelector('[data-k="demo"]').parentElement.classList.toggle('auto',I.demoM==null);
   $('lbDemoU').textContent='解体単価（'+I.struct+'）';
   $('saleNote').textContent=`売却価格は「利回りで出した価格」と「土地値${I.demoOn?' − 解体費':''}」の高い方。土地値は未入力なら土地の固定資産税評価額 ÷ 0.7、解体費は延床 × 解体単価（構造ごとに設定・初期値として保存可）で自動計算（入力すると上書き、空にすると自動に戻る）。${I.mode==='corp'?'売却益も法人税率で計算':'売却時は譲渡所得税 5年超20.315%／5年以下39.63%'}。`;}
  $('lbUnit').textContent='修繕単価（'+I.struct+'）';
  // 閉じた時の要約
  $('sumProp').textContent=I.price?`${fm(I.price)}万・${fd(I.rent/I.price*100||0,2)}%・${I.struct}${I.buyYear?'・'+I.buyYear+'年取得(今'+D.nowT+'年目)':''}`:'';
  $('sumRatio').textContent=`建物${fd(D.bratio,1)}%（${ev?'評価額から':'手入力'}）`;
  $('sumCf').textContent=`空室${fd(I.vac,1)}%・経費${fd(I.exp,1)}%・下落${fd(I.dec,2)}%・修繕${fm(D.repair)}万/${I.every}年`;
  $('sumLoan').textContent=`諸費用${fm(D.buyAmt)}万(${fd(I.buyPct,1)}%)・${fm(I.loan)}万・${fd(I.rate,2)}%・${I.term}年`;
}

/* ===== 指標（1年目） ===== */
function renderInd(){
  const I=cur.inp,r=M.rows[0],tot=I.price+D.buyAmt,ok=I.price>0&&I.rent>0;
  const p1=v=>isFinite(v)?fd(v,2)+'<small> %</small>':'−';
  const cls=(v,g,w)=>!isFinite(v)?'':(v>=g?'ok':v>=w?'warn':'bad');
  const clsR=(v,g,w)=>!isFinite(v)?'':(v<=g?'ok':v<=w?'warn':'bad');
  const fcr=ok?r.noi/tot*100:NaN, ccr=ok&&M.own>0?r.cf/M.own*100:NaN, roi=ok?r.cf/tot*100:NaN;
  const dscr=ok&&M.pay>0?r.noi/M.pay:NaN, prr=ok?M.pay/I.rent*100:NaN;
  const ber=ok?M.pay/(I.rent*(1-I.exp/100))*100:NaN;
  const K=I.loan>0?M.pay/I.loan*100:NaN, yg=ok?fcr-K:NaN;
  const t=[
    ['表面利回り',ok?p1(I.rent/I.price*100):'−','','満室家賃 ÷ 価格'],
    ['実質利回り',p1(fcr),cls(fcr,7,5),'（実収入−経費）÷（価格＋購入諸費用）'],
    ['CCR',p1(ccr),cls(ccr,10,5),'自己資金に対する手残り：1年目の手残り ÷ 自己資金'],
    ['ROI',p1(roi),cls(roi,4,2),'総投資額に対する手残り：1年目の手残り ÷（価格＋購入諸費用）'],
    ['DSCR',isFinite(dscr)?fd(dscr,2)+'<small> 倍</small>':'−',cls(dscr,1.3,1.1),'（実収入−経費）÷ 年間返済。1.3倍以上が目安'],
    ['返済比率',p1(prr),clsR(prr,50,60),'年間返済 ÷ 満室家賃。50%以下が目安'],
    ['分岐入居率',p1(ber),clsR(ber,70,85),'手残りがゼロになる入居率。低いほど安全'],
    ['イールドG',p1(yg),cls(yg,2,1),'実質利回り − ローン定数（年間返済 ÷ 借入額）']
  ];
  $('ind').innerHTML=t.map(([l,v,c,h])=>`<div class="ind" title="${h}"><span class="l">${l}</span><span class="n ${c}">${v}</span></div>`).join('');
}
/* ===== 結果表示 ===== */
function nice(v){if(!(v>0))return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),q=v/p;return (q<=1?1:q<=2?2:q<=5?5:10)*p;}
function renderChart(){
  const box=$('chart'),W=Math.max(300,box.clientWidth||600),sp=W<600;
  const H=sp?200:250,H2=sp?64:84,H3=sp?56:70,L=sp?42:58,R=8,T=10,B=8,iw=W-L-R,ih=H-T-B,rows=M.rows,Y=cur.Y;
  const vs=[];rows.forEach(r=>vs.push(r.hold,r.spl,r.post));
  let mn=Math.min(0,...vs),mx=Math.max(0,...vs);const st=nice((mx-mn)/(sp?4:5));
  mn=Math.floor(mn/st)*st;mx=Math.ceil(mx/st)*st;if(mx===mn)mx=mn+st;
  const x=t=>L+(t-0.5)*iw/40,y=v=>T+(mx-v)/(mx-mn)*ih;
  const line=k=>rows.map((r,i)=>(i?'L':'M')+x(r.t).toFixed(1)+' '+y(r[k]).toFixed(1)).join(' ');
  let g='',lab='';
  for(let v=mn;v<=mx+0.001;v+=st){const yy=y(v).toFixed(1);g+=`M${L} ${yy}H${W-R}`;lab+=`<text x="${L-6}" y="${(+yy+3.5).toFixed(1)}" text-anchor="end" font-size="${sp?9:10}" fill="#5E6763">${fm(v)}</text>`;}
  const sx=x(Y).toFixed(1),nx=x(D.nowT).toFixed(1),showNow=!!cur.inp.buyYear;
  const cfs=rows.map(r=>r.cf);let bmn=Math.min(0,...cfs),bmx=Math.max(0,...cfs);if(bmx===bmn)bmx=bmn+1;
  const by=v=>4+(bmx-v)/(bmx-bmn)*(H2-8),bw=iw/40*0.62;
  let pos='',neg='',sel='';
  rows.forEach(r=>{const x0=(x(r.t)-bw/2).toFixed(1),y0=by(Math.max(0,r.cf)).toFixed(1),y1=by(Math.min(0,r.cf)).toFixed(1);
    const d=`M${x0} ${y0}h${bw.toFixed(1)}V${y1}h${(-bw).toFixed(1)}Z`;if(r.t===Y)sel+=d;else if(r.cf<0)neg+=d;else pos+=d;});
  const pers=rows.map(r=>r.per);let pmn=Math.min(0,...pers),pmx=Math.max(0,...pers);if(pmx===pmn)pmx=pmn+1;
  const pbest=rows.reduce((a,r)=>r.per>a.per?r:a,rows[0]);
  const py=v=>6+(pmx-v)/(pmx-pmn)*(H3-14);
  const pline=rows.map((r,i)=>(i?'L':'M')+x(r.t).toFixed(1)+' '+py(r.per).toFixed(1)).join(' ');
  const xt=(sp?[1,10,20,30,40]:[1,5,10,15,20,25,30,35,40]).map(t=>`<text x="${x(t).toFixed(1)}" y="${H+H2+H3+13}" text-anchor="middle" font-size="${sp?9:10}" fill="#5E6763">${t}年</text>`).join('');
  const hit=rows.map(r=>`<rect x="${(x(r.t)-iw/80).toFixed(1)}" y="0" width="${(iw/40).toFixed(1)}" height="${H+H2+H3}" fill="transparent" data-y="${r.t}"><title>${r.t}年目</title></rect>`).join('');

    await findFile();
    if(!fileId){await driveSave();if(manual)toast('ドライブにまだデータがないため、この端末の内容を保存しました');return;}
    const j=await (await gfetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`)).json();
    const before=JSON.stringify(store.items);
    store=mergeStore(store,j||{});store.defaults.unitMap=Object.assign({},UNIT0,store.defaults.unitMap||{});store.defaults.demoMap=Object.assign({},DEMO,store.defaults.demoMap||{});
    try{localStorage.setItem(LS_KEY,JSON.stringify(store));}catch(e){}
    if(cur.id&&!store.items.find(i=>i.id===cur.id))cur.id=null;
    renderTabs();
    if(JSON.stringify(store.items)!==JSON.stringify((j&&j.items)||[]))driveSave();
    if(manual||before!==JSON.stringify(store.items))toast('ドライブの履歴を読み込みました');
  }catch(e){toast('ドライブ読み込みエラー: '+e.message);}
}
async function driveSave(){
  if(!token)return;
  if(saving){saveAgain=true;return;}saving=true;
  try{
    if(!fileId)await findFile();
    const body=new Blob([JSON.stringify(store)],{type:'application/json'});
    if(fileId){await gfetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body});}
    else{const form=new FormData();form.append('metadata',new Blob([JSON.stringify({name:DRIVE_FILE,parents:[folderId()]})],{type:'application/json'}));form.append('file',body);
      const j=await (await gfetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',body:form})).json();fileId=j.id;}
  }catch(e){toast('ドライブ保存エラー: '+e.message);}
  finally{saving=false;if(saveAgain){saveAgain=false;driveSave();}}
}

/* ===== マイソク読み取り ===== */
const CFG={get worker(){return localStorage.getItem('mk_worker')||'https://maisoku-ai.elle-71-boc.workers.dev';},get model(){return localStorage.getItem('mk_model')||'claude-sonnet-4-6';}};
const EXTRACT_PROMPT=`あなたは不動産マイソク(物件販売図面)の読取器です。画像/PDFから以下のJSONだけを出力してください。前置き・コードブロック記法は禁止。読み取れない項目はnull。数値は数値型で。
{"property_name":"物件名","address":"所在地の住所","price_man_yen":販売価格(万円),"annual_rent_man_yen":満室想定の年間家賃収入(万円),"gross_yield_pct":表面利回り(%),"structure":"構造(例:木造,軽量鉄骨造,鉄骨造,RC造,SRC造)","built_year":築年(西暦の数値),"units":総戸数,"building_floor_area_sqm":建物延床面積(㎡),"land_area_sqm":土地面積(㎡)}
家賃が月額でしか書かれていない場合は12倍して年額にする。和暦は西暦に直す。価格は万円単位の数値にする。`;
function toBase64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=()=>rej(new Error('ファイルを読めません'));r.readAsDataURL(file);});}
function resizeImage(file,maxDim,q){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const sc=Math.min(1,maxDim/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);res(c.toDataURL('image/jpeg',q).split(',')[1]);};img.onerror=()=>rej(new Error('画像を読めません'));img.src=URL.createObjectURL(file);});}
async function extract(files){
  files=[...files].filter(f=>f.type==='application/pdf'||f.type.startsWith('image/'));
  if(!files.length){toast('PDFか画像を選んでください');return;}
  loading(true,'マイソクを読み取り中…');
  try{
    const content=[];
    for(const f of files){
      if(f.type==='application/pdf')content.push({type:'document',source:{type:'base64',media_type:'application/pdf',data:await toBase64(f)}});
      else content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:await resizeImage(f,2000,0.85)}});
    }
    content.push({type:'text',text:(files.length>1?'複数の画像は同一物件マイソクの表裏・分割ページです。統合して読み取ってください。\n':'')+EXTRACT_PROMPT});
    const resp=await fetch(CFG.worker+'/anthropic',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:CFG.model,max_tokens:1200,messages:[{role:'user',content}]})});
    const data=await resp.json();if(data.error)throw new Error(data.error.message||'読み取りエラー');
    const text=(data.content||[]).map(c=>c.text||'').join('');
    applyExtract(JSON.parse(text.replace(/```json|```/g,'').trim()));
  }catch(e){toast('読み取りに失敗しました: '+e.message);}
  finally{loading(false);}
}
function applyExtract(j){
  if(cur.id||cur.dirty&&cur.inp.price>0){if(!confirm('新しい評価として読み込みます。よろしいですか？'))return;}
  startNew();const I=cur.inp,chk=['landEval','bldgEval'];
  const num=v=>typeof v==='number'&&isFinite(v)?v:pn(v);
  I.name=j.property_name||'';I.addr=j.address||'';
  const price=num(j.price_man_yen),rent=num(j.annual_rent_man_yen),y=num(j.gross_yield_pct);
  I.price=price||0;I.rent=rent||(price&&y?Math.round(price*y/100*100)/100:0);
  const st=String(j.structure||'');I.struct=/SRC|RC|鉄筋/i.test(st)?'RC':/軽量/.test(st)?'軽量鉄骨':/鉄骨|S造/i.test(st)?'重量鉄骨':'木造';
  if(!st)chk.push('struct');
  I.built=num(j.built_year)||0;I.units=num(j.units)||0;I.floor=num(j.building_floor_area_sqm)||0;I.landArea=num(j.land_area_sqm)||0;
  I.loan=0;
  [['price',I.price],['rent',I.rent],['built',I.built],['units',I.units],['floor',I.floor],['landArea',I.landArea],['loan',0]].forEach(([k,v])=>{if(!v)chk.push(k);});
  cur.chk=chk;cur.dirty=true;saveDraft();renderAll();
  toast('読み取りました。黄色の欄を確認してください');
}
$('btnUp').addEventListener('click',()=>$('fileIn').click());
$('fileIn').addEventListener('change',e=>{extract(e.target.files);e.target.value='';});
const dropArea=$('inp');
['dragover','dragenter'].forEach(ev=>dropArea.addEventListener(ev,e=>{e.preventDefault();$('btnUp').classList.add('drag');}));
['dragleave','drop'].forEach(ev=>dropArea.addEventListener(ev,()=>$('btnUp').classList.remove('drag')));
dropArea.addEventListener('drop',e=>{e.preventDefault();extract(e.dataTransfer.files);});
document.addEventListener('paste',e=>{const fs=[...(e.clipboardData?.items||[])].filter(i=>i.kind==='file').map(i=>i.getAsFile()).filter(Boolean);if(fs.length){e.preventDefault();extract(fs);}});

/* ===== 起動 ===== */
(function init(){
  try{const d=JSON.parse(localStorage.getItem('sim_draft')||'null');if(d&&d.inp){cur=d;cur.inp=Object.assign(newInp(),d.inp);if(cur.id&&!store.items.find(i=>i.id===cur.id))cur.id=null;}}catch(e){}
  if(window.innerWidth<1000)document.querySelectorAll('details').forEach(d=>{if(d.dataset.sec!=='prop')d.open=false;});
  renderAll();initGis();
  if(tokenValid()){setDrv(true);driveLoad();}
})();
</script>
